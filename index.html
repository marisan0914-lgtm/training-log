<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRAINING">
  <meta name="format-detection" content="telephone=no">
  <title>TRAINING LOG</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sheet" hidden></div>

  <nav id="nav">
    <button data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M4 9h2v6H4zM18 9h2v6h-2zM7 7h2v10H7zM15 7h2v10h-2zM9 11h6v2H9z"/></svg>
      <span>今日</span>
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M5 5h14v2H5zM5 11h14v2H5zM5 17h14v2H5z"/></svg>
      <span>履歴</span>
    </button>
    <button data-tab="growth">
      <svg viewBox="0 0 24 24"><path d="M3 18l6-6 4 4 7-8 1.4 1.4L13 18.8l-4-4-4.6 4.6z"/></svg>
      <span>成長</span>
    </button>
    <button data-tab="menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h11v2H3zM18 6h3v2h-3zM14 3.5h3v7h-3zM3 16h4v2H3zM11 16h10v2H11zM7 13.5h3v7H7z"/></svg>
      <span>メニュー</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
